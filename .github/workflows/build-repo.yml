---
name: Build Pacman Repo
permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-pacman-repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
    env:
      CONTAINER_DIR: pkgbuilds
    strategy:
      fail-fast: true
    steps:
      - name: Container Setup
        run: |
          pacman -Syy --disable-download-timeout --needed --noconfirm \
            archlinux-keyring
          pacman -Syu --disable-download-timeout --needed --noconfirm \
            base-devel \
            cmake \
            git \
            pixman \
            libdrm \
            cairo \
            pango
          pacman -Scc --noconfirm

          # Patch makepkg to allow running as root
          sed -i 's/exit $E_ROOT/echo "Running as root..."/' /usr/bin/makepkg

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Git directory
        run: git config --global --add safe.directory /__w/hyprspiral/hyprspiral

      - name: Init
        run: |
          # create the destination directory for built packages
          mkdir -p repo

          # patch the build flags
          # shellcheck disable=SC2016  # we don't want to expand the expression here
          sed -i 's,#MAKEFLAGS="-j2",MAKEFLAGS="-j$(nproc)",g' /etc/makepkg.conf

      - name: Build Packages
        shell: bash
        run: |
          # Build all packages using the unified build script
          # This handles two-phase build: hyprland-spiral first, then others
          ./build.sh --install

          # Collect built packages to repo/
          echo "=== Collecting packages ==="
          find "${CONTAINER_DIR}" -name "*.pkg.tar.zst" -type f -exec cp -v {} repo/ \;

          # Create repository database
          echo "=== Creating repository database ==="
          repo-add repo/hyprspiral.db.tar.gz repo/*.pkg.tar.zst

          # Verify packages exist
          if [[ -z "$(ls repo/*.pkg.tar.zst 2>/dev/null)" ]]; then
            echo "::error:: No packages built"
            exit 1
          fi

          echo "=== Built packages ==="
          ls -la repo/

      - name: Prepare Release Info
        id: release_info
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Daily/nightly build - use fixed "nightly" tag
            # This allows all nightly builds to update the same release
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "name=Nightly Build" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            # Tagged release
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: repo/*
          generateReleaseNotes: true
          makeLatest: ${{ steps.release_info.outputs.make_latest }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          tag: ${{ steps.release_info.outputs.tag }}
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
